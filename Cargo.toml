[package]
name = "ytfast"
version = "0.1.0"
edition = "2024"
description = "A desktop audio-only player for YouTube, in the spirit of YouTube Music"
license = "MIT"

[dependencies]
wsola = "0.3"
gpui-ce = "0.2.2"
gpui_ce_platform = "0.1.0"
anyhow = "1"
dirs = "6"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
reqwest = { version = "0.12", features = ["json"] }
rfd = "0.15"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "io-util", "macros", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
open = "5"
notify-rust = "4"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-aac", "symphonia-isomp4", "symphonia-mp3", "symphonia-vorbis", "symphonia-flac", "symphonia-wav"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.21", default-features = false }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.dev.package.wsola]
opt-level = 3
